<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roulette Boisson</title>
<style>
  :root {
    --bg: #1a0b2e;
    --bg2: #2d1450;
    --accent: #ff2e63;
    --accent2: #08d9d6;
    --gold: #f9c80e;
    --text: #f5f5f5;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at top, var(--bg2), var(--bg));
    font-family: 'Segoe UI', system-ui, sans-serif;
    color: var(--text);
    padding: 20px;
  }
  .card {
    background: rgba(255,255,255,0.05);
    border: 2px solid rgba(255,255,255,0.1);
    border-radius: 24px;
    padding: 32px;
    max-width: 420px;
    width: 100%;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    backdrop-filter: blur(10px);
  }
  h1 {
    margin: 0 0 8px;
    font-size: 1.6em;
    background: linear-gradient(90deg, var(--accent), var(--gold));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .subtitle {
    opacity: 0.7;
    font-size: 0.9em;
    margin-bottom: 24px;
  }
  .wheel-wrap {
    position: relative;
    width: 260px;
    height: 260px;
    margin: 0 auto 28px;
  }
  .pointer {
    position: absolute;
    top: -14px;
    left: 50%;
    transform: translateX(-50%);
    width: 0; height: 0;
    border-left: 14px solid transparent;
    border-right: 14px solid transparent;
    border-top: 24px solid var(--gold);
    z-index: 5;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
  }
  #wheel {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    border: 6px solid var(--gold);
    transition: transform 4.5s cubic-bezier(0.17, 0.67, 0.1, 1);
    box-shadow: 0 0 0 4px rgba(0,0,0,0.3), inset 0 0 30px rgba(0,0,0,0.4);
  }
  .center-dot {
    position: absolute;
    top: 50%; left: 50%;
    width: 20px; height: 20px;
    background: var(--gold);
    border-radius: 50%;
    transform: translate(-50%, -50%);
    box-shadow: 0 0 10px rgba(0,0,0,0.5);
    z-index: 4;
  }
  button#spin {
    background: linear-gradient(90deg, var(--accent), #ff5e8e);
    color: white;
    border: none;
    padding: 14px 36px;
    font-size: 1.1em;
    font-weight: 700;
    border-radius: 50px;
    cursor: pointer;
    box-shadow: 0 8px 20px rgba(255,46,99,0.4);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    letter-spacing: 0.5px;
  }
  button#spin:hover { transform: translateY(-2px); box-shadow: 0 12px 24px rgba(255,46,99,0.5); }
  button#spin:active { transform: translateY(0); }
  button#spin:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
  #result {
    margin-top: 22px;
    min-height: 70px;
    font-size: 1.4em;
    font-weight: 800;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transform: scale(0.8);
    transition: opacity 0.4s ease, transform 0.4s ease;
  }
  #result.show { opacity: 1; transform: scale(1); }
  .result-drink { color: var(--accent2); }
  .result-give { color: var(--gold); }
  .result-culsec { color: var(--accent); }
  .footer-note {
    margin-top: 16px;
    font-size: 0.75em;
    opacity: 0.5;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>🍻 Roulette Boisson</h1>
    <div class="subtitle">Tourne la roue, subis les conséquences</div>

    <div class="wheel-wrap">
      <div class="pointer"></div>
      <div class="center-dot"></div>
      <svg id="wheel" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>

    <button id="spin">TOURNER</button>

    <div id="result"></div>
    <div class="footer-note">🥃 Bois avec modération</div>
  </div>

<script>
  // Segments: type + weight-ish via count. Two special cases: cul sec (boire) & donne un cul sec.
  const segments = [
    { type: 'drink', label: n => `Bois ${n} gorgées`, color: '#08d9d6' },
    { type: 'give',  label: n => `Distribue ${n} gorgées`, color: '#f9c80e' },
    { type: 'drink', label: n => `Bois ${n} gorgées`, color: '#08d9d6' },
    { type: 'give',  label: n => `Distribue ${n} gorgées`, color: '#f9c80e' },
    { type: 'culsec-drink', label: () => `CUL SEC 🍺`, color: '#ff2e63' },
    { type: 'drink', label: n => `Bois ${n} gorgées`, color: '#08d9d6' },
    { type: 'give',  label: n => `Distribue ${n} gorgées`, color: '#f9c80e' },
    { type: 'culsec-give', label: () => `Donne un CUL SEC 🔥`, color: '#c9184a' },
  ];

  const wheel = document.getElementById('wheel');
  const spinBtn = document.getElementById('spin');
  const resultEl = document.getElementById('result');
  const segAngle = 360 / segments.length;

  function polar(cx, cy, r, angleDeg) {
    const a = (angleDeg - 90) * Math.PI / 180;
    return [cx + r * Math.cos(a), cy + r * Math.sin(a)];
  }

  function buildWheel() {
    const cx = 100, cy = 100, r = 96;
    let svg = '';
    segments.forEach((seg, i) => {
      const startAngle = i * segAngle;
      const endAngle = startAngle + segAngle;
      const [x1, y1] = polar(cx, cy, r, startAngle);
      const [x2, y2] = polar(cx, cy, r, endAngle);
      const largeArc = segAngle > 180 ? 1 : 0;
      svg += `<path d="M${cx},${cy} L${x1},${y1} A${r},${r} 0 ${largeArc} 1 ${x2},${y2} Z" fill="${seg.color}" stroke="#1a0b2e" stroke-width="1"/>`;
      const midAngle = startAngle + segAngle / 2;
      const [tx, ty] = polar(cx, cy, r * 0.62, midAngle);
      const short = seg.type === 'drink' ? 'BOIS' : seg.type === 'give' ? 'DONNE' : seg.type === 'culsec-drink' ? 'CUL SEC' : 'CUL SEC+';
      svg += `<text x="${tx}" y="${ty}" fill="#1a0b2e" font-size="8" font-weight="700" text-anchor="middle" dominant-baseline="middle" transform="rotate(${midAngle}, ${tx}, ${ty})">${short}</text>`;
    });
    wheel.innerHTML = svg;
  }

  buildWheel();

  let currentRotation = 0;
  let spinning = false;

  spinBtn.addEventListener('click', () => {
    if (spinning) return;
    spinning = true;
    resultEl.classList.remove('show');
    spinBtn.disabled = true;

    const winnerIndex = Math.floor(Math.random() * segments.length);
    const extraSpins = 5 + Math.floor(Math.random() * 3);
    const targetSegmentCenter = winnerIndex * segAngle + segAngle / 2;
    const finalRotation = extraSpins * 360 + (360 - targetSegmentCenter);

    currentRotation += finalRotation;
    wheel.style.transform = `rotate(${currentRotation}deg)`;

    setTimeout(() => {
      const seg = segments[winnerIndex];
      let sips = 1 + Math.floor(Math.random() * 5); // 1 to 5
      let text = seg.label(sips);
      let cls = 'result-drink';
      if (seg.type === 'give') cls = 'result-give';
      if (seg.type === 'culsec-drink' || seg.type === 'culsec-give') cls = 'result-culsec';

      resultEl.textContent = text;
      resultEl.className = cls;
      resultEl.classList.add('show');
      spinning = false;
      spinBtn.disabled = false;
    }, 4600);
  });
</script>
</body>
</html>
